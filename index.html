<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกม XO (Tic-Tac-Toe)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="mode-overlay" class="mode-overlay">
        <div class="mode-select-box">
            <h2>เลือกโหมดเกม</h2>
            <button id="mode-human" class="mode-btn">เล่นสองคน</button>
            <button id="mode-bot" class="mode-btn">เล่นกับบอท</button>
        </div>
    </div>
    <button id="change-mode-btn" class="mode-btn" style="position:fixed;top:24px;right:32px;z-index:1100;font-size:0.95em;padding:6px 18px;">เปลี่ยนโหมด</button>
    <div class="container" id="main-container" style="display:none;">
        <h1>เกม XO (Tic-Tac-Toe)</h1>
        <div id="game-board" class="board">
        
        </div>
        <div id="status" class="status"></div>
        <button id="restart-btn">เริ่มใหม่</button>
    </div>
    <div id="popup-modal" class="modal">
        <div class="modal-content">
            <span id="close-modal" class="close">&times;</span>
            <div id="modal-message"></div>
            <button id="modal-restart">เล่นใหม่</button>
        </div>
    </div>
    <script src="script.js"></script>
    <footer style="text-align:center; margin-top: 30px; color: #888; font-size: 1em;">
        Made by Pusira Gasu
    </footer>
</body>
</html>
